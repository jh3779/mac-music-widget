name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests and macOS builds
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install XcodeGen 2.46.0
        shell: bash
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$archive"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $archive" | shasum -a 256 --check
          ditto -x -k "$archive" "$RUNNER_TEMP/xcodegen-download"
          echo "$RUNNER_TEMP/xcodegen-download/xcodegen/bin" >> "$GITHUB_PATH"
      - name: JavaScript tests
        run: node --test Tests/JavaScript/*.test.cjs
      - name: Swift tests
        run: swift test --enable-code-coverage
      - name: Safari, host and WidgetKit build
        run: |
          xcodegen generate --spec project-safari.yml
          xcodebuild -project MacMusicWidget.xcodeproj -scheme MacMusicWidgetHost -configuration Debug -derivedDataPath "$RUNNER_TEMP/widget-build" CODE_SIGNING_ALLOWED=NO build
      - name: Music-only build
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project MacMusicWidget.xcodeproj -scheme MacMusicWidgetHost -configuration Debug -derivedDataPath "$RUNNER_TEMP/widget-build" CODE_SIGNING_ALLOWED=NO build
